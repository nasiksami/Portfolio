<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The tags between the two seo markers are the development defaults. The
      production build replaces the whole block, per route, with the title,
      description, canonical, Open Graph, Twitter and JSON-LD tags generated
      by src/seo.js (see scripts/prerender.mjs).
    -->
    <!--seo:start-->
    <title>Nasik Sami Khan | AI Software Developer | Applied AI &amp; Machine Learning</title>
    <meta name="description" content="Development build of nasik.ca." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!--seo:end-->
    <meta name="theme-color" content="#0e1226" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Horizon pairs Fraunces (display; optical-size, weight, softness and
         wonk axes) with Public Sans (text). Only the ranges used by the UI are
         requested. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap"
      rel="stylesheet"
    />

    <!--
      Apply a stored sky pin before first paint so there is no flash of the
      wrong palette. No pin means the sky follows the scroll arc, starting at
      pre-dawn. Stored values stay 'light' | 'dark' for compatibility with
      preferences saved by the earlier designs.

      The `js` class tells the stylesheet that scripts run, which is what lets
      scroll reveals start hidden. Without it (no JavaScript) everything in
      the pre-rendered page is simply visible.
    -->
    <script>
      (function () {
        document.documentElement.classList.add('js');
        // If the app has not started within a few seconds (a blocked or failed
        // script), drop the class so nothing is left waiting to be revealed.
        setTimeout(function () {
          if (!window.__appStarted) document.documentElement.classList.remove('js');
        }, 4000);
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark') document.documentElement.setAttribute('data-sky-pin', 'night');
          else if (stored === 'light') document.documentElement.setAttribute('data-sky-pin', 'day');
        } catch (e) {
          /* Storage blocked — the sky simply follows the arc. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
